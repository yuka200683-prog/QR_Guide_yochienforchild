<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>附属幼稚園</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    text-align:center;
    background:#f8f9fa;
}

.screen{
    display:none;
    min-height:100vh;
    padding:40px 20px;
    box-sizing:border-box;
}

.active{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.arrow{
    font-size:120px;
    margin:20px;
}

h1{
    font-size:2em;
}

p{
    font-size:1.3em;
    max-width:500px;
}

button{
    padding:15px 30px;
    font-size:1.2em;
    border:none;
    border-radius:12px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- 画面1 -->
<div id="screen1" class="screen active">
    <h1>ようこそ！</h1>
    <p>ここはようち園</p>
　　<img src="yochien.png">
    <button onclick="nextScreen(2)">次にすすむ</button>
</div>

<!-- 画面2 -->
<div id="screen2" class="screen">
    <p>どんなばしょ？</p>
    <h1>遊びながら、子どもたちそれぞれにとって楽しいことをさがすばしょ</h1>
　　 <button onclick="nextScreen(3)">次にすすむ</button>
</div>

<!-- 画面3 -->
<div id="screen3" class="screen">
    <h1>今どこにいるか見てみよう</h1>
　　<img src="yochien1.png">
    <p>次に行きたいところを見つけよう</p>
　　 <button onclick="nextScreen(4)">次にすすむ</button>
</div>

<!-- 画面4 -->
<div id="screen4" class="screen">
    <h1>ほかのたてもののばしょを見てみよう</h1>
　　<a href="https://www.ocha.ac.jp/access/ochacampusmap.html">
 　 くわしいキャンパスマップはこちら</a>
　　<img src="zentaizu.png">
</div>


<script>
function nextScreen(num){
    document.querySelectorAll(".screen").forEach(
        s => s.classList.remove("active")
    );

    document
      .getElementById("screen"+num)
      .classList.add("active");
}
</script>

</body>
</html>
